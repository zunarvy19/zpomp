# Keep TLS termination at the reverse proxy and preserve its original Host header.
map_hash_bucket_size 64;
map $host $legacy_domain {
    default 0;
    www.tirtaagungteknik.com 1;
    zunaidipompa.zvy.my.id 1;
    www.zunaidipompa.zvy.my.id 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($legacy_domain) {
        return 301 https://tirtaagungteknik.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
